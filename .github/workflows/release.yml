name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Version
        id: ver
        shell: bash
        run: |
          ver="$(awk -F'[<>]' '/<Version>/{print $3; exit}' src/TGManager/TGManager.csproj)"
          if [[ -z "$ver" ]]; then
            echo "Version is missing in TGManager.csproj" >&2
            exit 1
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "APP_VERSION=$ver" >> "$GITHUB_ENV"

      - name: .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Worker deps
        run: |
          python -m pip install -U pip wheel
          python -m pip install pyinstaller Pillow
          python -m pip install -r requirements-worker.txt
          python -c "import opentele, telethon, python_socks; print('worker imports ok', opentele.__file__)"

      - name: Icons
        run: python assets/make_icon.py

      - name: Publish WPF
        run: |
          dotnet restore TGManager.sln
          dotnet publish src/TGManager/TGManager.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=embedded `
            -p:Version=${{ env.APP_VERSION }} `
            -o dist/app

      - name: Check WPF exe
        run: |
          if (-not (Test-Path dist/app/TGManager.exe)) { throw "TGManager.exe не собран" }
          Get-Item dist/app/TGManager.exe | Format-List Name, Length

      - name: PyInstaller worker
        run: python -m PyInstaller --clean --noconfirm --distpath dist --workpath build/pyi worker.spec

      - name: Check worker exe
        run: |
          if (-not (Test-Path dist/TGWorker.exe)) { throw "TGWorker.exe не собран" }
          Get-Item dist/TGWorker.exe | Format-List Name, Length

      - name: Pack portable folder
        shell: pwsh
        run: |
          $ver = "${{ env.APP_VERSION }}"
          $out = "dist/TG-Manager"
          if (Test-Path $out) { Remove-Item $out -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item dist/app/TGManager.exe $out/TGManager.exe
          Copy-Item dist/TGWorker.exe $out/TGWorker.exe
          Copy-Item README.md $out/README.txt
          if (Test-Path RELEASE_NOTES.md) { Copy-Item RELEASE_NOTES.md $out/RELEASE_NOTES.txt }
          $zip = "dist/TG-Manager-$ver.zip"
          if (Test-Path $zip) { Remove-Item $zip }
          Compress-Archive -Path $out -DestinationPath $zip -CompressionLevel Optimal
          Get-Item $zip | Format-List Name, Length
          "PORTABLE_ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TG-Manager-${{ env.APP_VERSION }}
          path: dist/TG-Manager-*.zip
          if-no-files-found: error

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "v${{ env.APP_VERSION }}"
          $zip = Get-ChildItem dist/TG-Manager-*.zip | Select-Object -First 1
          $notes = Get-Content -Raw RELEASE_NOTES.md
          $title = "TG Manager ${{ env.APP_VERSION }} — Windows 10/11"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag $zip.FullName --title $title --notes $notes --target ${{ github.sha }} --latest
          } else {
            gh release upload $tag $zip.FullName --clobber
            gh release edit $tag --notes $notes --title $title --latest
          }
          gh release view $tag
